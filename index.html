<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chúc Ngủ Ngon! 🌙✨</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            background: linear-gradient(to bottom, #0b1d3a, #020514);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #ffffff;
            overflow: hidden;
            position: relative;
        }

        /* Bầu trời sao lấp lánh */
        .star {
            position: absolute;
            background-color: #fff;
            border-radius: 50%;
            animation: twinkle var(--duration) infinite ease-in-out;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        /* Màn hình chào để chạm mở & phát nhạc */
        #welcome-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(11, 29, 58, 0.96);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            cursor: pointer;
            transition: opacity 0.8s ease, visibility 0.8s;
        }

        #welcome-overlay .envelope {
            font-size: 80px;
            animation: pulse 1.5s infinite;
        }

        #welcome-overlay p {
            margin-top: 15px;
            font-size: 1.2rem;
            color: #ffd166;
            letter-spacing: 1px;
            text-align: center;
            padding: 0 20px;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.15); }
            100% { transform: scale(1); }
        }

        /* Card thiệp chúc */
        .card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            padding: 30px 25px;
            border-radius: 24px;
            text-align: center;
            max-width: 420px;
            width: 90%;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            z-index: 10;
            animation: fadeIn 1.5s ease-in-out;
            max-height: 90vh;
            overflow-y: auto;
        }

        /* Khung chứa 2 ảnh */
        .gallery {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 15px;
        }

        .photo-container {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            overflow: hidden;
            border: 3px solid rgba(255, 255, 255, 0.7);
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.4);
            animation: float 3s infinite ease-in-out;
        }

        .photo-container:nth-child(2) {
            animation-delay: 1.5s;
        }

        .photo-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        h1 {
            font-size: 1.6rem;
            margin-bottom: 10px;
            color: #ffd166;
        }

        p {
            font-size: 0.95rem;
            line-height: 1.5;
            color: #e0e6ed;
            margin-bottom: 20px;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            background: linear-gradient(45deg, #ff758c, #ff7eb3);
            border: none;
            padding: 10px 20px;
            color: white;
            font-weight: bold;
            font-size: 0.9rem;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(255, 117, 140, 0.4);
        }

        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(255, 117, 140, 0.6);
        }

        .btn-music {
            background: linear-gradient(45deg, #4facfe, #00f2fe);
            box-shadow: 0 4px 15px rgba(79, 172, 254, 0.4);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <!-- Màn hình chạm để phát nhạc -->
    <div id="welcome-overlay" onclick="startExperience()">
        <div class="envelope">💌</div>
        <p>Bấm vào đây để mở món quà nhé! ✨</p>
    </div>

    <!-- Tạo bầu trời sao -->
    <script>
        const starCount = 80;
        for (let i = 0; i < starCount; i++) {
            let star = document.createElement('div');
            star.className = 'star';
            let size = Math.random() * 3 + 1;
            star.style.width = size + 'px';
            star.style.height = size + 'px';
            star.style.top = Math.random() * 100 + 'vh';
            star.style.left = Math.random() * 100 + 'vw';
            star.style.setProperty('--duration', (Math.random() * 3 + 2) + 's');
            document.body.appendChild(star);
        }
    </script>

    <!-- File nhạc lấy trực tiếp từ GitHub của bạn -->
    <audio id="bg-music" loop preload="auto">
        <source src="nhac.mp3" type="audio/mp3">
    </audio>

    <div class="card">
        <!-- 2 ảnh chính xác trên repo của bạn -->
        <div class="gallery">
            <div class="photo-container">
                <img src="9d0b6a53-3bb2-4f3d-bfff-c50c0ce26924.jpg" alt="Ảnh 1">
            </div>
            <div class="photo-container">
                <img src="c84e8444-b251-45f0-9f7d-34d91ca2a5c6.jpg" alt="Ảnh 2">
            </div>
        </div>

        <h1>Chúc Bé Ngủ Ngon! 🌙✨</h1> 
        <p id="wish-text">
            Một ngày dài mệt mỏi trôi qua rồi, hãy gác lại mọi phiền muộn và chìm vào giấc ngủ thật sâu nhé. 
            Chúc cậu có những giấc mơ thật đẹp! 🎶💤
        </p>
        
        <div class="btn-group">
            <button class="btn" onclick="changeWish()">Đổi lời chúc ❤️</button>
            <button class="btn btn-music" id="music-btn" onclick="toggleMusic()">🔇 Tắt nhạc</button>
        </div>
    </div>

    <script>
        const music = document.getElementById('bg-music');
        const musicBtn = document.getElementById('music-btn');
        let isPlaying = false;

        // Tự động phát nhạc khi chạm vào màn hình mở thiệp
        function startExperience() {
            const overlay = document.getElementById('welcome-overlay');
            overlay.style.opacity = '0';
            setTimeout(() => {
                overlay.style.visibility = 'hidden';
            }, 800);

            music.play().then(() => {
                isPlaying = true;
                musicBtn.innerText = "🔇 Tắt nhạc";
            }).catch(err => {
                console.log("Lỗi phát nhạc: ", err);
            });
        }

        // Đổi câu chúc ngẫu nhiên
        function changeWish() {
            const wishes = [
                "Mong cậu ngủ thật ngon và ngày mai thức dậy tràn đầy năng lượng! 🌟",
                "Đừng thức khuya nữa nha, mau gấp chăn đi ngủ thôi nào! 🛌",
                "Gửi tặng cậu cả bầu trời sao ngọt ngào và giấc mơ bình yên nhất! ✨💖",
                "Tắt điện thoại, nhắm mắt lại và chìm vào giấc ngủ cùng điệu nhạc nhẹ nhàng nhé! 🌙🎶"
            ];
            const randomWish = wishes[Math.floor(Math.random() * wishes.length)];
            document.getElementById('wish-text').innerText = randomWish;
        }

        // Bật / Tắt nhạc
        function toggleMusic() {
            if (isPlaying) {
                music.pause();
                musicBtn.innerText = "🎵 Bật nhạc";
                musicBtn.style.background = "linear-gradient(45deg, #4facfe, #00f2fe)";
                isPlaying = false;
            } else {
                music.play();
                musicBtn.innerText = "🔇 Tắt nhạc";
                musicBtn.style.background = "linear-gradient(45deg, #ff9966, #ff5e62)";
                isPlaying = true;
            }
        }
    </script>
</body>
</html>
