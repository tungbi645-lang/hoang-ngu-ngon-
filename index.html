<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chúc Ngủ Ngon! 🌙</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            background: linear-gradient(to bottom, #0b1d3a, #020514);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #ffffff;
            overflow: hidden;
            position: relative;
        }

        /* Hiệu ứng bầu trời sao */
        .star {
            position: absolute;
            background-color: #fff;
            border-radius: 50%;
            animation: twinkle var(--duration) infinite ease-in-out;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        /* Card chúc ngủ ngon */
        .card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            padding: 30px 25px;
            border-radius: 24px;
            text-align: center;
            max-width: 420px;
            width: 90%;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            z-index: 10;
            animation: fadeIn 2s ease-in-out;
            max-height: 90vh;
            overflow-y: auto;
        }

        /* Khung chứa ảnh */
        .photo-container {
            width: 110px;
            height: 110px;
            margin: 0 auto 15px auto;
            border-radius: 50%;
            overflow: hidden;
            border: 3px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.4);
            animation: float 3s infinite ease-in-out;
        }

        .photo-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        h1 {
            font-size: 1.6rem;
            margin-bottom: 10px;
            color: #ffd166;
        }

        p {
            font-size: 0.95rem;
            line-height: 1.5;
            color: #e0e6ed;
            margin-bottom: 20px;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            background: linear-gradient(45deg, #ff758c, #ff7eb3);
            border: none;
            padding: 10px 20px;
            color: white;
            font-weight: bold;
            font-size: 0.9rem;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(255, 117, 140, 0.4);
        }

        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(255, 117, 140, 0.6);
        }

        .btn-music {
            background: linear-gradient(45deg, #4facfe, #00f2fe);
            box-shadow: 0 4px 15px rgba(79, 172, 254, 0.4);
        }

        .btn-music:hover {
            box-shadow: 0 6px 20px rgba(79, 172, 254, 0.6);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <!-- Tạo sao ngẫu nhiên bằng JS -->
    <script>
        const starCount = 80;
        for (let i = 0; i < starCount; i++) {
            let star = document.createElement('div');
            star.className = 'star';
            let size = Math.random() * 3 + 1;
            star.style.width = size + 'px';
            star.style.height = size + 'px';
            star.style.top = Math.random() * 100 + 'vh';
            star.style.left = Math.random() * 100 + 'vw';
            star.style.setProperty('--duration', (Math.random() * 3 + 2) + 's');
            document.body.appendChild(star);
        }
    </script>

    <!-- Nhạc nền Chúc bé ngủ ngon (dùng link nhạc trực tuyến nhẹ nhàng) -->
    <audio id="bg-music" loop>
        <source src="https://ia801509.us.archive.org/19/items/LullabyMozart_201603/Lullaby.mp3" type="audio/mp3">
    </audio>

    <div class="card">
        <!-- PHẦN ẢNH: Đã điền tên file ảnh từ màn hình của bạn -->
        <div class="photo-container">
            <img src="9d0b6a53-3bb2-4f3d-bfff-c50c0ce26924.jpg" alt="Ảnh kỷ niệm">
        </div>

        <h1>Chúc Bé Ngủ Ngon Nhé! 🌙✨</h1> 
        <p id="wish-text">
            Một ngày dài mệt mỏi trôi qua rồi, hãy gác lại mọi phiền muộn và chìm vào giấc ngủ thật sâu nhé. 
            Chúc cậu có những giấc mơ thật đẹp và bình yên! 😴💤
        </p>
        
        <div class="btn-group">
            <button class="btn" onclick="changeWish()">Đổi lời chúc ❤️</button>
            <button class="btn btn-music" id="music-btn" onclick="toggleMusic()">🎵 Phát nhạc</button>
        </div>
    </div>

    <script>
        function changeWish() {
            const wishes = [
                "Mong cậu ngủ thật ngon và ngày mai thức dậy tràn đầy năng lượng! 🌟",
                "Đừng thức khuya nữa nha, mau gấp chăn đi ngủ thôi nào! 🛌",
                "Gửi tặng cậu cả bầu trời sao ngọt ngào và giấc mơ đẹp nhất! ✨💖",
                "Tắt điện thoại, nhắm mắt lại và ngủ thật ngon nhé bé ơi! 🌙"
            ];
            const randomWish = wishes[Math.floor(Math.random() * wishes.length)];
            document.getElementById('wish-text').innerText = randomWish;
        }

        // Xử lý bật tắt nhạc nền
        const music = document.getElementById('bg-music');
        const musicBtn = document.getElementById('music-btn');
        let isPlaying = false;

        function toggleMusic() {
            if (isPlaying) {
                music.pause();
                musicBtn.innerText = "🎵 Phát nhạc";
                musicBtn.style.background = "linear-gradient(45deg, #4facfe, #00f2fe)";
            } else {
                music.play().then(() => {
                    isPlaying = true;
                    musicBtn.innerText = "🔇 Tắt nhạc";
                    musicBtn.style.background = "linear-gradient(45deg, #ff9966, #ff5e62)";
                }).catch(e => {
                    alert("Trình duyệt chặn phát nhạc tự động, bạn hãy bấm lại lần nữa nhé!");
                });
            }
            isPlaying = !isPlaying;
        }
    </script>
</body>
</html>
